[project]
name = "infraaxon"
version = "0.1.0"
description = "Infrastructure-aware agents for evidence-based diagnostics"
requires-python = ">=3.12,<3.14"
license = "Apache-2.0"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "httpx>=0.28,<1",
  "cryptography>=44", "pydantic>=2.10,<3", "redis>=5,<7", "pymongo>=4.11,<5",
  "boto3>=1.36,<2", "confluent-kafka>=2.8,<3", "psycopg[binary]>=3.2,<4",
  "docker>=7.1,<8", "prometheus-client>=0.21,<1"
]
[dependency-groups]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.25,<1", "ruff>=0.11,<1"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["platform/infraaxon"]
[tool.pytest.ini_options]
pythonpath = ["platform"]
asyncio_mode = "auto"
[tool.ruff]
line-length = 120
