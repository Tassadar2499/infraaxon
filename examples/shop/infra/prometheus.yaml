global: {scrape_interval: 10s}
scrape_configs:
  - job_name: platform
    static_configs: [{targets: ['platform:8000']}]
  - job_name: shop
    static_configs: [{targets: ['otel:8889']}]
  - job_name: redis
    static_configs: [{targets: ['redis-exporter:9121']}]
  - job_name: kafka
    static_configs: [{targets: ['kafka-exporter:9308']}]
