name: infraaxon-shop
x-app: &app
  networks: [agents]
  environment: &app-env
    MONGO_URL: mongodb://toxiproxy:18666
    KAFKA_URL: toxiproxy:19092
    OTEL_EXPORTER_OTLP_ENDPOINT: http://otel:4317
    SCENARIO_KEY: ${SCENARIO_KEY}
  depends_on:
    proxy-init: {condition: service_completed_successfully}
  restart: unless-stopped
services:
  mongo:
    image: mongo:8.0.13
    networks: [agents]
    volumes: [mongo-data:/data/db]
    healthcheck: {test: [CMD, mongosh, --quiet, --eval, "db.adminCommand('ping').ok"], interval: 10s, timeout: 5s, retries: 20}
  redis:
    image: redis:7.4.5-alpine
    networks: [agents]
  minio:
    build: {context: ../.., dockerfile: examples/shop/infra/Minio.Dockerfile}
    image: infraaxon-minio:2025.09.07
    command: [server, /data, --console-address, ":9001"]
    environment: {MINIO_ROOT_USER: "${MINIO_ROOT_USER}", MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD}"}
    volumes: [minio-data:/data]
    networks: [agents]
    ports: ["127.0.0.1:19001:9001"]
  kafka:
    image: apache/kafka:4.0.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://toxiproxy:19092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks: [agents]
    volumes: [kafka-data:/tmp/kraft-combined-logs]
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0
    networks: [agents]
  proxy-init:
    image: infraaxon-agent:0.1.0
    command: [python, /setup/proxies.py]
    volumes: [./infra:/setup:ro]
    networks: [agents]
    depends_on:
      mongo: {condition: service_healthy}
      redis: {condition: service_started}
      toxiproxy: {condition: service_started}
      kafka: {condition: service_started}
  catalog:
    <<: *app
    build: {context: ../.., dockerfile: examples/shop/backend/Dockerfile, args: {SERVICE: Catalog}}
    environment:
      <<: *app-env
      REDIS_URL: toxiproxy:16379
      S3_URL: http://toxiproxy:19000
      MINIO_USER: ${MINIO_ROOT_USER}
      MINIO_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports: ["127.0.0.1:18101:8080"]
  orders:
    <<: *app
    build: {context: ../.., dockerfile: examples/shop/backend/Dockerfile, args: {SERVICE: Orders}}
    environment:
      <<: *app-env
      CATALOG_URL: http://catalog:8080
    ports: ["127.0.0.1:18102:8080"]
  worker:
    <<: *app
    build: {context: ../.., dockerfile: examples/shop/backend/Dockerfile, args: {SERVICE: Worker}}
  storefront:
    build: {context: ../.., dockerfile: examples/shop/frontend/Dockerfile}
    ports: ["127.0.0.1:18081:80"]
    networks: [agents]
    depends_on: [catalog, orders]
  scenarios:
    image: infraaxon-agent:0.1.0
    command: [uvicorn, controller:app, --app-dir, /scenario, --host, 0.0.0.0, --port, "8000"]
    environment: {SCENARIO_KEY: "${SCENARIO_KEY}"}
    volumes: [./scenarios:/scenario:ro]
    ports: ["127.0.0.1:18090:8000"]
    networks: [agents]
    depends_on: {proxy-init: {condition: service_completed_successfully}}
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.3
    environment: {discovery.type: single-node, xpack.security.enabled: "false", ES_JAVA_OPTS: "-Xms768m -Xmx768m"}
    volumes: [elastic-data:/usr/share/elasticsearch/data]
    networks: [agents]
  kibana:
    image: docker.elastic.co/kibana/kibana:8.19.3
    environment: {ELASTICSEARCH_HOSTS: 'http://elasticsearch:9200'}
    ports: ["127.0.0.1:15601:5601"]
    networks: [agents]
    depends_on: [elasticsearch]
  otel:
    image: otel/opentelemetry-collector-contrib:0.132.0
    command: ["--config=/etc/otel.yaml"]
    volumes: [./infra/otel.yaml:/etc/otel.yaml:ro]
    networks: [agents]
    depends_on: [elasticsearch]
  prometheus:
    image: prom/prometheus:v3.5.0
    volumes: [./infra/prometheus.yaml:/etc/prometheus/prometheus.yml:ro, prometheus-data:/prometheus]
    networks: [agents]
    ports: ["127.0.0.1:19090:9090"]
  redis-exporter:
    image: oliver006/redis_exporter:v1.76.0
    environment: {REDIS_ADDR: 'redis://redis:6379'}
    networks: [agents]
  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.9.0
    command: ["--kafka.server=toxiproxy:19092"]
    networks: [agents]
    depends_on: [kafka, proxy-init]
  grafana:
    image: grafana/grafana:12.1.1
    environment: {GF_AUTH_ANONYMOUS_ENABLED: "true", GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer, GF_AUTH_DISABLE_LOGIN_FORM: "true"}
    volumes: [./infra/grafana:/etc/grafana/provisioning:ro]
    ports: ["127.0.0.1:13000:3000"]
    networks: [agents]
  postgres:
    image: postgres:17.6-alpine
    environment: {POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}", POSTGRES_READ_PASSWORD: "${POSTGRES_READ_PASSWORD}"}
    volumes: [postgres17-data:/var/lib/postgresql/data, ./infra/postgres-init.sh:/docker-entrypoint-initdb.d/init.sh:ro]
    networks: [agents]
    healthcheck: {test: [CMD-SHELL, "pg_isready -U postgres"], interval: 10s, timeout: 5s, retries: 20}
  openproject:
    image: openproject/openproject:16.4.1
    profiles: [collaboration]
    environment:
      OPENPROJECT_HOST__NAME: localhost:18083
      OPENPROJECT_HTTPS: "false"
      OPENPROJECT_ADDITIONAL__HOST__NAMES: '["openproject"]'
      OPENPROJECT_SECRET_KEY_BASE: ${OPENPROJECT_SECRET_KEY_BASE}
      DATABASE_URL: postgres://openproject:${POSTGRES_PASSWORD}@postgres/openproject
    volumes: [openproject-data:/var/openproject/assets]
    ports: ["127.0.0.1:18083:80"]
    networks: [agents]
    depends_on: {postgres: {condition: service_healthy}}
  wikijs:
    image: ghcr.io/requarks/wiki:2.5.308
    profiles: [collaboration]
    environment: {DB_TYPE: postgres, DB_HOST: postgres, DB_PORT: "5432", DB_USER: wikijs, DB_PASS: "${POSTGRES_PASSWORD}", DB_NAME: wikijs}
    ports: ["127.0.0.1:18084:3000"]
    networks: [agents]
    depends_on: {postgres: {condition: service_healthy}}
  mattermost:
    image: mattermost/mattermost-team-edition:10.11.2
    profiles: [collaboration]
    environment:
      MM_SQLSETTINGS_DRIVERNAME: postgres
      MM_SQLSETTINGS_DATASOURCE: postgres://mattermost:${POSTGRES_PASSWORD}@postgres/mattermost?sslmode=disable&connect_timeout=10
      MM_SERVICESETTINGS_SITEURL: http://localhost:18085
      MM_SERVICESETTINGS_ENABLELOCALMODE: "true"
    ports: ["127.0.0.1:18085:8065"]
    volumes: [mattermost-data:/mattermost/data]
    networks: [agents]
    depends_on: {postgres: {condition: service_healthy}}
networks:
  agents: {external: true, name: infraaxon-agents}
volumes:
  mongo-data:
  minio-data:
  kafka-data:
  elastic-data:
  prometheus-data:
  postgres17-data:
  openproject-data:
  mattermost-data:
